name: Zampto-Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'    # 每天北京时间上午 9:00 运行 (UTC 1:00)

jobs:
  run_zampto_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 下载公库代码
        uses: actions/checkout@v4

      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: kanezikii/Zampto-Renew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本
        run: mv private/zampto_renew.py zampto_renew.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ 安装系统与 Python 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable xvfb x11-utils xdotool
          pip install --upgrade seleniumbase requests
          seleniumbase install chromedriver

      - name: 🛡️ 启动 Xray 代理转发
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          if [ -z "$XRAY_CONFIG" ]; then
            echo "未配置 XRAY_CONFIG，跳过 Xray 代理启动"
          else
            echo "📦 正在下载并配置 Xray..."
            wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip -q Xray-linux-64.zip -d xray_bin
            chmod +x xray_bin/xray
            
            echo "$XRAY_CONFIG" > xray_bin/config.json
            nohup ./xray_bin/xray run -c ./xray_bin/config.json > xray.log 2>&1 &
            sleep 4
            
            echo "🌐 测试通过代理获取的出口 IP:"
            curl -s -x socks5h://127.0.0.1:10808 https://api.ipify.org || echo "⚠️ 代理测试超时或失败，但将继续执行"
            echo -e "\n✅ Xray 代理服务已就绪"
          fi

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          ZAMPTO_ACCOUNT: ${{ secrets.ZAMPTO_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
          ZAMPTO_COOKIES: ${{ secrets.ZAMPTO_COOKIES }}
          CF_COOKIES: ${{ secrets.CF_COOKIES }}
        run: |
          if [ -n "$XRAY_CONFIG" ]; then
            export USE_PROXY="true"
          else
            export USE_PROXY="false"
          fi
          xvfb-run \
          --auto-servernum \
          --server-args="-screen 0 1920x1080x24" \
          python zampto_renew.py
          EXIT_CODE=$?

          # 清除环境变量中的代理，防止后续 Node.js 步骤（如 artifact 上传）因 SOCKS5 报错
          echo "ALL_PROXY=" >> $GITHUB_ENV
          echo "HTTP_PROXY=" >> $GITHUB_ENV
          echo "HTTPS_PROXY=" >> $GITHUB_ENV

          exit $EXIT_CODE

      - name: 📸 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        env:
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: '*'
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 1

      - name: 🧹 清理旧工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 1
          keep_minimum_runs: 3
